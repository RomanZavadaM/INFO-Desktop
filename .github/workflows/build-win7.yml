name: Build INFO Desktop Windows 7 compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'main.py'
      - 'src/**'
      - 'packaging/**'
      - 'VERSION.txt'
      - '.github/workflows/build-win7.yml'

permissions:
  contents: read

jobs:
  build-win7:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x64'

      - name: Compile source
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWDsrc"
          python -m py_compile main.py src/info_desktop/*.py
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Windows 7 packager
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install pyinstaller==5.13.2

      - name: Build Windows 7 portable
        run: python -m PyInstaller --noconfirm --clean packaging/INFO_Desktop.spec

      - name: Verify bundle
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/INFO-Desktop/INFO-Desktop.exe')) { throw 'INFO-Desktop.exe missing' }
          if (!(Get-ChildItem 'dist/INFO-Desktop' -Recurse -Filter python38.dll | Select-Object -First 1)) { throw 'python38.dll missing' }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/INFO-Desktop' -DestinationPath 'INFO-Desktop_0.1.0-dev_Windows7_x64_Portable.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: INFO-Desktop-0.1.0-dev-Windows7-x64
          path: INFO-Desktop_0.1.0-dev_Windows7_x64_Portable.zip
          retention-days: 14
