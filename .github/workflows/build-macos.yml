name: Build INFO Desktop macOS
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**','src-tauri/**','package.json','tsconfig.json','vite.config.ts','VERSION.txt','.github/workflows/build-macos.yml']
permissions: {contents: read}
jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@stable
      - run: test "$(uname -m)" = "${{ matrix.arch }}"
      - run: npm install
      - run: npm run tauri build
      - run: |
          mkdir artifact
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "artifact/INFO-Desktop_0.1-r1_macOS_${{ matrix.arch }}_Portable.zip"
          shasum -a 256 artifact/*.zip > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: 'INFO-Desktop-0.1-r1-macOS-${{ matrix.arch }}', path: 'artifact/', retention-days: 14}
