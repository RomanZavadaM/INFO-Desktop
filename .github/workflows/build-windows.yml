name: Build INFO Desktop Windows
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**','src-tauri/**','package.json','tsconfig.json','vite.config.ts','VERSION.txt','.github/workflows/build-windows.yml']
permissions: {contents: read}
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri build
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe','.msi' } | Copy-Item -Destination artifact
          if (!(Get-ChildItem artifact -File | Select-Object -First 1)) { throw 'No Windows installer produced' }
      - shell: pwsh
        run: |
          Get-ChildItem artifact -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content -Encoding ascii artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: INFO-Desktop-0.1.5-Windows-x64, path: 'artifact/', retention-days: 14}
