name: INFO Desktop docs
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f README.md
          for f in en de es fr ko ja; do test -f "docs/i18n/README.$f.md"; done
          for f in uk en de es fr ko ja; do test -f "src/locales/$f.json"; done
