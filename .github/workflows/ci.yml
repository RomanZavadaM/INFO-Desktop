name: INFO Desktop checks

on:
  pull_request:
  push:
    branches:
      - main
      - prototype/read-only-client

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile source
        run: |
          PYTHONPATH=src python -m py_compile main.py src/info_desktop/*.py
      - name: Run tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify multilingual docs
        run: |
          test -f README.md
          for f in en de es fr ko ja; do test -f "docs/i18n/README.$f.md"; done
