[package]
name="info-desktop"
version="0.1.3"
description="Universal desktop newsroom client for INFO-compatible servers"
authors=["Roman Zavada"]
edition="2021"

[lib]
name="info_desktop_lib"
crate-type=["staticlib","cdylib","rlib"]

[build-dependencies]
tauri-build={version="2",features=[]}

[dependencies]
base64="0.22"
serde={version="1",features=["derive"]}
tauri={version="2.12.4",features=[]}
reqwest={version="0.12",default-features=false,features=["rustls-tls"]}
url="2"

keyring="4.2"
serde_json="1"
