[package]
name="info-desktop-cli"
version="0.1.5"
description="INFO Desktop console mode"
authors=["Roman Zavada"]
edition="2021"

[lib]
name="info_desktop_cli"
path="src/lib.rs"

[[bin]]
name="info-desktop-cli"
path="src/main.rs"

[dependencies]
info-desktop-core={path="../core"}
base64="0.22"
serde={version="1",features=["derive"]}
serde_json="1"
tokio={version="1",features=["rt"]}
